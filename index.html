<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy of Love</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { overflow: hidden; height: 100%; background: #000; font-family: Georgia, serif; }
        .webgl { position: fixed; top: 0; left: 0; width: 100%; height: 100%; outline: none; }
        .heart { position: absolute; color: rgba(255, 100, 100, 0.15); font-size: 24px; animation: float 15s infinite ease-in-out; z-index: 0; pointer-events: none; }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.3; } 50% { transform: translateY(-20px) rotate(10deg); opacity: 0.7; } }
        .credits { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); color: #fff; font-family: 'Pacifico', cursive; font-size: 16px; text-align: center; text-shadow: 0 0 3px #fff, 0 0 10px #ff6030; z-index: 10; pointer-events: none; }
        .instructions { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); color: rgba(255, 255, 255, 0.7); font-family: Georgia, serif; font-size: 14px; text-align: center; background: rgba(0, 0, 0, 0.3); padding: 8px 16px; border-radius: 20px; backdrop-filter: blur(5px); z-index: 10; }
        .menu-button { position: fixed; top: 15px; left: 15px; width: 40px; height: 40px; background: rgba(0, 0, 0, 0.4); border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; z-index: 20; backdrop-filter: blur(5px); }
        .menu-button span { display: block; width: 20px; height: 2px; background: white; margin: 2px 0; border-radius: 1px; }
        .config-panel { position: fixed; top: 0; left: -320px; width: 300px; height: 100%; background: rgba(10, 10, 20, 0.95); backdrop-filter: blur(10px); z-index: 15; padding: 20px; display: flex; flex-direction: column; overflow-y: auto; transition: left 0.3s ease; border-right: 1px solid rgba(255, 96, 48, 0.3); }
        .config-panel.open { left: 0; }
        .config-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.2); }
        .config-title { color: white; font-family: 'Pacifico', cursive; font-size: 24px; }
        .close-button { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        .config-section { margin-bottom: 25px; padding: 15px; background: rgba(30, 30, 40, 0.6); border-radius: 15px; }
        .config-section h3 { color: #ff6030; margin-bottom: 15px; font-family: 'Pacifico', cursive; font-size: 20px; }
        .config-option { margin-bottom: 12px; }
        .config-option label { display: block; color: white; margin-bottom: 5px; font-size: 14px; }
        .config-option input[type="range"] { width: 100%; cursor: pointer; }
        .toggle-switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #ff6030; }
        input:checked + .slider:before { transform: translateX(26px); }
        .color-options { display: flex; gap: 10px; flex-wrap: wrap; }
        .color-option { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-option.active { border-color: white; transform: scale(1.1); }
        .developer-info { margin-top: auto; padding: 20px; background: rgba(20, 20, 30, 0.8); border-radius: 15px; text-align: center; border: 1px solid rgba(255, 96, 48, 0.3); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 14; display: none; }
        .overlay.active { display: block; }
    </style>
</head>
<body>
    <canvas class="webgl"></canvas>
    <div class="instructions">Te Amo Muchote</div>
    <div class="credits">GHOTS KILLERS</div>
    <div class="menu-button" id="menuButton"><span></span><span></span><span></span></div>
    <div class="overlay" id="overlay"></div>
    <div class="config-panel" id="configPanel">
        <div class="config-header">
            <div class="config-title">Configuración</div>
            <button class="close-button" id="closeButton">✕</button>
        </div>
        <div class="config-section">
            <h3>Corazones Orbitales</h3>
            <div class="config-option"><label>Tamaño</label><input type="range" id="heartSize" min="0.3" max="1.2" step="0.1" value="0.8"></div>
            <div class="config-option"><label>Velocidad</label><input type="range" id="heartSpeed" min="0" max="1" step="0.05" value="0.25"></div>
            <div class="config-option">
                <label>Color</label>
                <div class="color-options">
                    <div class="color-option active" style="background-color: #FFD700;" data-color="#FFD700"></div>
                    <div class="color-option" style="background-color: #ff0055;" data-color="#ff0055"></div>
                    <div class="color-option" style="background-color: #8a2be2;" data-color="#8a2be2"></div>
                    <div class="color-option" style="background-color: #01ffff;" data-color="#01ffff"></div>
                </div>
            </div>
        </div>
        <div class="config-section">
            <h3>Corazón Central</h3>
            <div class="config-option"><label>Tamaño</label><input type="range" id="centerHeartSize" min="2.0" max="5.0" step="0.2" value="3.2"></div>
        </div>
        <div class="developer-info"><h3>MR</h3><p>Te Amo Mucho Mami</p></div>
    </div>

    <script type="module">
        import * as THREE from "https://cdn.skypack.dev/three@0.132.2";
        import { OrbitControls } from "https://cdn.skypack.dev/three@0.132.2/examples/jsm/controls/OrbitControls.js";

        function createCSSHearts() {
            const heartSymbols = ['♾️', '💖', '✨', '👑', '💎'];
            for (let i = 0; i < 30; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.top = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 15 + 's';
                document.body.appendChild(heart);
            }
        }
        createCSSHearts();

        const canvas = document.querySelector('canvas.webgl');
        const scene = new THREE.Scene();
        const parameters = { heartCount: 16, particlesPerHeart: 800, heartSize: 0.8, insideColor: '#FFD700', outsideColor: '#ff6030', centerHeartSize: 3.2, autoRotateSpeed: 0.25 };

        let heartStructures = [], heartCoreSystems = [], heartTexts = [], textSprites = [], centerHeart = null;

        const createInvertedHeartGeometry = (size = 1.0, particleCount = 1500) => {
            const positions = new Float32Array(particleCount * 3), colors = new Float32Array(particleCount * 3);
            const colorInside = new THREE.Color(parameters.insideColor), colorOutside = new THREE.Color(parameters.outsideColor);
            for (let i = 0; i < particleCount; i++) {
                const t = Math.random() * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                positions[i*3] = x * size * 0.04; positions[i*3+1] = y * size * 0.04; positions[i*3+2] = (Math.random()-0.5) * size * 0.1;
                const mixedColor = colorInside.clone().lerp(colorOutside, Math.random());
                colors[i*3] = mixedColor.r; colors[i*3+1] = mixedColor.g; colors[i*3+2] = mixedColor.b;
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            return geo;
        };

        const generateHearts = () => {
            heartStructures.forEach(h => scene.remove(h)); heartStructures = [];
            if(centerHeart) scene.remove(centerHeart);
            
            for (let i = 0; i < parameters.heartCount; i++) {
                const geo = createInvertedHeartGeometry(parameters.heartSize, parameters.particlesPerHeart);
                const mat = new THREE.PointsMaterial({ size: 0.02, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true });
                const heart = new THREE.Points(geo, mat);
                const angle = (i / parameters.heartCount) * Math.PI * 2;
                heart.position.set(Math.cos(angle) * 4, 0, Math.sin(angle) * 4);
                scene.add(heart); heartStructures.push(heart);
            }
            const cGeo = createInvertedHeartGeometry(parameters.centerHeartSize, 3000);
            centerHeart = new THREE.Points(cGeo, new THREE.PointsMaterial({ size: 0.03, vertexColors: true, blending: THREE.AdditiveBlending }));
            scene.add(centerHeart);
        };

        const starsGeo = new THREE.BufferGeometry();
        const starsPos = new Float32Array(5000 * 3);
        for(let i=0; i<15000; i++) starsPos[i] = (Math.random()-0.5) * 100;
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({ size: 0.1, color: 0xffffff })));

        generateHearts();

        const sizes = { width: window.innerWidth, height: window.innerHeight };
        const camera = new THREE.PerspectiveCamera(75, sizes.width / sizes.height, 0.1, 1000);
        camera.position.set(0, 3, 8);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(sizes.width, sizes.height);
        const controls = new OrbitControls(camera, canvas);
        controls.autoRotate = true;

        window.addEventListener('resize', () => {
            sizes.width = window.innerWidth; sizes.height = window.innerHeight;
            camera.aspect = sizes.width / sizes.height; camera.updateProjectionMatrix();
            renderer.setSize(sizes.width, sizes.height);
        });

        document.getElementById('menuButton').onclick = () => { document.getElementById('configPanel').classList.add('open'); document.getElementById('overlay').classList.add('active'); };
        document.getElementById('closeButton').onclick = document.getElementById('overlay').onclick = () => { document.getElementById('configPanel').classList.remove('open'); document.getElementById('overlay').classList.remove('active'); };
        document.getElementById('heartSize').oninput = (e) => { parameters.heartSize = parseFloat(e.target.value); generateHearts(); };
        document.querySelectorAll('.color-option').forEach(opt => opt.onclick = (e) => { parameters.insideColor = e.target.dataset.color; generateHearts(); });

        const animate = () => {
            controls.update();
            if(centerHeart) centerHeart.rotation.y += 0.01;
            heartStructures.forEach(h => h.rotation.y += 0.02);
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        };
        animate();
    </script>
</body>
</html>
